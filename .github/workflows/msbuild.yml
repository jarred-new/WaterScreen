name: Build Legacy MSVC 2013 Solution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install MSVC 2013 Build Tools
      run: |
        choco install microsoft-build-tools-2013 --yes --no-progress

    # FIX: Manually inject the legacy 2013 installation directory into the GitHub runner PATH
    - name: Add Legacy MSBuild 2013 to Path
      run: |
        echo "C:\Program Files (x86)\MSBuild\12.0\Bin" >> $env:GITHUB_PATH
      shell: powershell

    - name: Restore NuGet Packages (Optional)
      run: nuget restore your-solution.sln

    - name: Build Solution
      run: |
        msbuild WaterScreen.sln /p:Configuration=Release /p:Platform="Any CPU" /p:PlatformToolset=v120

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: msvc2013-build-output
        path: |
          **/Release/*.exe
          **/Release/*.dll
          **/Release/*.pdb
        retention-days: 5
